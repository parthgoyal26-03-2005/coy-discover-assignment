services:
  postgres:
    image: postgres:17-alpine
    ports:
      - '127.0.0.1:54329:5432'
    environment:
      POSTGRES_USER: coy
      POSTGRES_PASSWORD: coy_local_only
      POSTGRES_DB: coy
    volumes:
      - coy-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U coy']
      interval: 3s
      retries: 10
volumes:
  coy-postgres:
